[phases.setup]
nixPkgs = ["nodejs_20"]
aptPkgs = [
  "libnss3", "libdbus-1-3", "libatk1.0-0", "libatk-bridge2.0-0",
  "libxcomposite1", "libxdamage1", "libxfixes3", "libxrandr2",
  "libgbm1", "libxkbcommon0", "libasound2", "libcups2"
]

[phases.install]
cmds = [
  "npm install -g pnpm",
  "ELECTRON_SKIP_BINARY_DOWNLOAD=1 pnpm install --ignore-scripts",
  "npx playwright install chromium"
]

[phases.build]
cmds = ["pnpm run build"]

[start]
cmd = "pnpm run start"
